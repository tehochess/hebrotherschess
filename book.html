<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book — He Brothers Chess</title>
<link rel="stylesheet" href="style.css">
<style>
  .book-layout {
    display: grid;
    grid-template-columns: 1fr 1.8fr;
    gap: 4rem;
    align-items: start;
    margin-top: 2.5rem;
  }
  .book-aside { position: sticky; top: 80px; }
  .book-aside p { font-size: 15px; color: var(--muted); line-height: 1.8; margin-bottom: 1.2rem; }
  .info-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 0.7rem 0;
    border-bottom: 1px solid var(--border);
    color: var(--muted);
  }
  .info-row span { color: var(--green-dark); font-weight: 500; }
  .form-wrap {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
  }
  .form-wrap iframe {
    width: 100%;
    height: 720px;
    border: none;
    display: block;
  }
  @media (max-width: 768px) {
    .book-layout { grid-template-columns: 1fr; gap: 2rem; }
    .book-aside { position: static; }
    .form-wrap iframe { height: 600px; }
  }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">He Brothers Chess</a>
  <ul class="nav-links">
    <li><a href="about.html">About</a></li>
    <li><a href="coaching.html">Coaching</a></li>
    <li><a href="assessment.html">Assessment</a></li>
    <li><a href="book.html" class="active">Book</a></li>
  </ul>
</nav>

<div class="page">
  <span class="section-tag">Book a session</span>
  <h1>Get in touch</h1>

  <div class="book-layout">
    <div class="book-aside">
      <p>Get in touch with us about any inquiries you have. We'll get back to you as soon as possible! </p>
    </div>

    <div class="form-wrap">
      <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSe4OzzNFv024zvLqgkTVZQPFMD1RxBuye_X7oNdzBZ6c0iBpg/viewform?embedded=true">
        Loading form...
      </iframe>
    </div>
  </div>
</div>

<footer>
  <span class="footer-logo">He Brothers Chess</span>
  <p>Seattle, WA · Lessons on Lichess</p>
</footer>
</body>
</html>
